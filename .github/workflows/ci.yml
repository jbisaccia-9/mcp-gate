name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m mcp_gate suite
      - run: python -m mcp_gate gate boundary   # must hold: 0 escapes
      - run: python -m mcp_gate gate prompt     # must still leak: non-vacuous demo
